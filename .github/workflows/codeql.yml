# CodeQL code scanning of the worker and scripts (Python), the UI
# (TypeScript), the shell (Rust) and these workflows (Actions). Every language
# is analysed from source, without a build. The alerts appear in the
# repository's Security tab. Secrets are covered by GitHub's secret scanning
# and push protection, which the repository settings turn on, and by the
# gitleaks pre-commit hook.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so that new queries also reach code that has not changed.
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The golden scenes and the test fixtures are data that the tests
          # compare, not code that the app runs.
          config: |
            paths-ignore:
              - scenes
              - tests/fixtures
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
