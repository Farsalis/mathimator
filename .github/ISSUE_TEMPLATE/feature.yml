name: Feature request
description: Propose something new for Mathimator.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What are you trying to make, and what stops you today? Mathimator is
        for a teacher or an explainer who makes one short math animation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What Mathimator should do. Sketches and example animations help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to get there, including what you do today.
  - type: textarea
    id: spec-impact
    attributes:
      label: Spec impact
      description: >-
        The sections of docs/design-spec.md this would change, if you know
        them. Some requests are outside v1 by design (spec section 1,
        Boundaries, and section 9, Later list): for example a freeform Python editor, plugins,
        the OpenGL renderer, scenes over 120 seconds, or Mac and Linux
        installers.
