# Mathimator's Manim settings, passed with --config_file to every render.
# Command-line flags override them. Manim also reads its own defaults and a
# per-user and a current-folder manim.cfg, but a render has neither: it runs in
# its scene's folder, which holds nothing else, and takes that folder as home.

[CLI]
# Manim deletes its least recently used cached clips above this count. A
# document has at most 120 s / 0.1 s = 1200 beats, so this keeps every clip of
# the render that just finished, and the clips of an earlier edit.
max_files_cached = 2400
