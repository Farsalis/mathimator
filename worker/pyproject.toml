[project]
name = "mathimator-worker"
version = "0.1.0"
description = "Mathimator render supervisor. This package does not depend on Manim."
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Mathimator contributors" }]
dependencies = []

[project.scripts]
mathimator-worker = "mathimator_worker.__main__:main"

[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mathimator_worker*"]

# Every render passes this file to Manim (argv.CONFIG_FILE).
[tool.setuptools.package-data]
mathimator_worker = ["manim.cfg"]
