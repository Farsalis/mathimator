# GitLab CI/CD for Mathimator on gitlab.com, Free tier (D65, D66, D67).
#
#   ci/linux.yml     lint, the fast test lanes, the UI build and the Rust
#                    pre-checks, on hosted Linux runners
#   ci/windows.yml   the Windows test lanes, the render lane and the
#                    installer, on the hosted Windows runner
#   ci/security.yml  SAST, Secret Detection and the dependency audits (D77)
#   ci/release.yml   the protected-tag release (D73, D74)
#   ci/renovate.yml  dependency updates (D76)
#
# The Free tier gives the namespace about 400 compute minutes a month, so
# pipelines spend them only where a change needs them (O2):
#
# - Pipelines run for merge requests, the default branch and tags. A branch
#   gets no pipeline of its own, so an open merge request never runs twice.
# - The one pipeline schedule, with the variable SCHEDULE_KIND=renovate, runs
#   Renovate alone. Any other schedule gets no pipeline: there is no nightly.
# - A merge request pipeline runs lint:repo, SAST and Secret Detection, and the
#   jobs of each lane whose files the change touches: the Python, Typst, UI
#   and Rust lanes, the dependency audits and the Windows fast lane.
# - A default-branch pipeline runs lint:repo, SAST and Secret Detection alone.
#   Merges are semi-linear (D69), so main gets the tree that the merge request
#   pipeline passed, and running the lanes again would spend the minutes twice.
# - The Windows Rust build, the render, export and offline suites and the
#   installer run on tags, and on demand as manual jobs that never block a
#   pipeline.
# - A tag pipeline runs every job.

include:
  - local: ci/linux.yml
  - local: ci/windows.yml
  - local: ci/security.yml
  - local: ci/release.yml
  - local: ci/renovate.yml

# build comes first because the Linux cargo job embeds desktop/dist from
# build:ui.
stages:
  - build
  - lint
  - test
  - package
  - release
  - maintain

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "renovate"
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  # uv keeps its cache and the CPython builds it manages (the bundle's
  # interpreters, D70) inside the checkout, where GitLab can cache them, and
  # syncs uv.lock as committed.
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  UV_PYTHON_INSTALL_DIR: $CI_PROJECT_DIR/.uv-python
  UV_MANAGED_PYTHON: "1"
  UV_LOCKED: "1"
  UV_LINK_MODE: copy

default:
  interruptible: true
  timeout: 30m
  # A hosted runner occasionally loses its VM. Test failures are never retried.
  retry:
    max: 1
    when: [runner_system_failure, scheduler_failure]

# The rules of a job that runs in every pipeline but the Renovate one. The job
# templates start from them; a lane job replaces them with its lane's rules,
# which start with the same first rule.
.every-pipeline:
  rules:
    - if: $SCHEDULE_KIND == "renovate"
      when: never
    - when: on_success
