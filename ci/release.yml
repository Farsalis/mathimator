# The release (D73). After the release merge request (.bumpversion.toml), a
# maintainer pushes the protected tag vX.Y.Z on the default branch. Its
# pipeline runs every job: lint:repo checks the tag against the app version
# (D72), the Linux and Windows suites and the render lane run (D68, O2), and
# package:windows builds the installer. Once all of them pass, the
# jobs below upload the installer, its notices and SHA256SUMS to the generic
# package registry and create a GitLab Release that links them, with notes
# git-cliff writes from the commits since the previous tag.
#
# Signing (D74) is a hook in ci/package-windows.ps1 that stays off until the
# WINDOWS_SIGN_COMMAND variable is set.

.release:
  stage: release
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"

release:notes:
  extends: [.uv, .release]
  variables:
    # git-cliff needs the history back to the previous tag.
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --tags
  script:
    # git-cliff does not create the folder it writes to.
    - mkdir -p reports
    - uv run git-cliff --latest --strip header --output reports/release-notes.md
  artifacts:
    paths: [reports/release-notes.md]
    expire_in: 1 week

# No needs, so it waits for every job in the earlier stages.
release:upload:
  extends: .release
  image: curlimages/curl:8.11.1
  dependencies: [package:windows]
  script:
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mathimator/${CI_COMMIT_TAG#v}"
    - |
      for file in out/package/*; do
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$PACKAGE_URL/$(basename "$file")"
      done
    - printf 'PACKAGE_URL=%s\nINSTALLER=%s\n' "$PACKAGE_URL" "$(basename out/package/*-setup.exe)" > release.env
  artifacts:
    reports:
      dotenv: release.env

# GitLab carries out the release: keyword with glab, which replaces the
# deprecated release-cli. GitLab.com writes the glab command line itself, so
# the image is the latest one its documentation names, not a pinned release.
release:publish:
  extends: .release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [release:notes, release:upload]
  script:
    - echo "Creating the GitLab Release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Mathimator $CI_COMMIT_TAG
    description: ./reports/release-notes.md
    assets:
      links:
        - name: $INSTALLER
          url: $PACKAGE_URL/$INSTALLER
          link_type: package
        - name: SHA256SUMS
          url: $PACKAGE_URL/SHA256SUMS
          link_type: other
        - name: THIRD_PARTY_NOTICES.txt
          url: $PACKAGE_URL/THIRD_PARTY_NOTICES.txt
          link_type: other
