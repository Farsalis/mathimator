# Renovate (D76): a pipeline schedule with the variable SCHEDULE_KIND=renovate
# runs this job and nothing else (.gitlab-ci.yml). It opens dependency update
# merge requests by the rules in renovate.json5. It needs two masked CI/CD
# variables: RENOVATE_TOKEN, a personal access token of a bot user with the
# api, read_user and write_repository scopes (gitlab.com's Free tier has no
# project access tokens), and GITHUB_COM_TOKEN, a read-only GitHub token for
# the release lookups on github.com (the pre-commit hooks) and the changelogs.

renovate:
  stage: maintain
  image:
    name: ghcr.io/renovatebot/renovate:41
    entrypoint: [""]
  rules:
    - if: $SCHEDULE_KIND == "renovate"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/.renovate
  cache:
    key: renovate
    paths: [.renovate]
  script:
    - renovate
