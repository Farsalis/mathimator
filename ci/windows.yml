# Jobs on gitlab.com's hosted Windows runner (D67): the Windows test lanes, the
# render lane and the installer. Jobs run in PowerShell. The runner image
# brings Git and the Visual Studio C++ Build Tools; ci/windows-tools.ps1
# installs the pinned uv, Node and Rust into the checkout and puts them on
# PATH.

.windows:
  tags: [saas-windows-medium-amd64]
  needs: []
  timeout: 1h
  variables:
    # The Node release that the Linux jobs' node image carries.
    # renovate: datasource=node-version depName=node
    NODE_VERSION: 24.22.1
    # npm keeps its cache in the checkout, where GitLab can cache it.
    npm_config_cache: $CI_PROJECT_DIR/.npm

# The fast lane runs in a merge request that changes what its tests cover: the
# worker, the tests, the scripts and the ci/ tests, and the Python dependencies
# and pins (D14). It runs on every tag, and never in the Renovate pipeline or
# on the default branch (.gitlab-ci.yml).
.on-windows-changes:
  rules:
    - if: $SCHEDULE_KIND == "renovate"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - worker/**/*
        - tests/**/*
        - scenes/**/*
        - scripts/**/*
        - ci/*.py
        - pyproject.toml
        - uv.lock
        - pytest.ini
        - .python-version
        - packaging/versions.env
        - ci/windows.yml
        - ci/windows-tools.ps1
        - .gitlab-ci.yml

# The heavy jobs (the Rust build, the render lane and the installer) run on
# every tag, and in other pipelines only when someone starts them (O2).
.on-tags-or-demand:
  rules:
    - if: $SCHEDULE_KIND == "renovate"
      when: never
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

.windows-uv-cache:
  cache:
    key:
      files: [uv.lock]
      prefix: $CI_JOB_NAME_SLUG
    paths: [.uv-cache, .uv-python]

# The bundle downloads, checked against packaging/versions.env on every reuse.
.windows-bundle-cache:
  cache:
    key:
      files: [packaging/versions.env, uv.lock]
      prefix: bundle-windows
    paths: [packaging/.cache]

.windows-cargo-cache:
  cache:
    key:
      files: [desktop/src-tauri/Cargo.lock]
      prefix: cargo-windows
    paths: [.cargo/registry/index, .cargo/registry/cache, .cargo/git/db]

.windows-npm-cache:
  cache:
    key:
      files: [desktop/package-lock.json]
      prefix: npm-windows
    paths: [.npm]

# The fast lane with the Win32 tests: the process-table walks and the Job
# Object reap tests (D14). The worker refuses a project path longer than 114
# characters while Windows long paths are off, and a test project under the
# runner profile's temp folder can pass that, so pytest works in a short
# folder at the drive root: pytest creates --basetemp but not its parent.
test:windows:
  extends: [.windows, .on-windows-changes, .windows-uv-cache]
  stage: test
  variables:
    MATHIMATOR_WIN32_TESTS: "1"
    # As on Linux, the fast lane needs no Manim: the dev group carries what
    # the fast tests import.
    UV_NO_GROUP: render
  script:
    - ./ci/windows-tools.ps1 -Uv
    - uv run pytest tests scripts ci -m "not render and not export and not offline and not typst" --basetemp=C:\pytest --junitxml=reports/junit-python-windows.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit-python-windows.xml

# Only Windows compiles the shell's cfg(windows) code, so Clippy runs here as
# well as in test:rust (D37). cargo test runs the ignored tests too:
# MATHIMATOR_WIN32_TESTS=1 lets the Job Object reap test run, and
# MATHIMATOR_REAL_WORKER_TESTS=1 the tests that start the repository's Python
# from .venv as a debug shell does: the real worker against the shell, its
# project lock included (TR24), and the interpreter behind the venv launcher
# (D16). The worker needs only the standard library, so a bare venv of the
# pinned Python serves them. The default custom-protocol feature embeds
# desktop/dist, which the job builds itself: build:ui runs only with the UI
# and Rust lanes.
test:rust:windows:
  extends: [.windows, .on-tags-or-demand]
  stage: test
  timeout: 1h 30m
  variables:
    MATHIMATOR_WIN32_TESTS: "1"
    MATHIMATOR_REAL_WORKER_TESTS: "1"
  cache:
    - !reference [.windows-uv-cache, cache]
    - !reference [.windows-cargo-cache, cache]
    - !reference [.windows-npm-cache, cache]
  script:
    - ./ci/windows-tools.ps1 -Uv -Node -Rust
    - uv venv
    - cd desktop
    - npm ci --prefer-offline --no-audit --no-fund
    - npm run build
    - cd src-tauri
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked -- --include-ignored

# The render, export and offline suites, against a bundle built here: the
# offline tests check it, and its TinyTeX and Typst serve the render tests.
# Job Objects stay on, as in the app. An xfail that passes fails the lane, so a
# fixed transparent WebM is noticed (D54).
test:render:windows:
  extends: [.windows, .on-tags-or-demand]
  stage: test
  timeout: 3h
  variables:
    MATHIMATOR_WIN32_TESTS: "1"
  cache:
    - !reference [.windows-uv-cache, cache]
    - !reference [.windows-bundle-cache, cache]
  script:
    - ./ci/windows-tools.ps1 -Uv
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/build-bundle.ps1
    - $runtime = Get-Content -Raw packaging/bundle/runtime.json | ConvertFrom-Json
    - $env:PATH = "$PWD\packaging\bundle\$($runtime.tinytexBin.Replace('/', '\'));$PWD\packaging\bundle\typst;$env:PATH"
    - uv run pytest tests -m "render or export or offline" -o xfail_strict=true --junitxml=reports/junit-render-windows.xml
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/**/*.json
      - out/**/*.log
    reports:
      junit: reports/junit-render-windows.xml

# The NSIS installer, built as a release ships it (ci/package-windows.ps1):
# the bundle, its notices and check, tauri build and SHA256SUMS.
package:windows:
  extends: [.windows, .on-tags-or-demand]
  stage: package
  timeout: 2h
  interruptible: false
  cache:
    - !reference [.windows-bundle-cache, cache]
    - !reference [.windows-cargo-cache, cache]
    - !reference [.windows-npm-cache, cache]
  script:
    - ./ci/windows-tools.ps1 -Node -Rust
    - ./ci/package-windows.ps1
  artifacts:
    name: mathimator-$CI_COMMIT_REF_SLUG
    when: always
    expire_in: 1 week
    paths:
      - out/package/
      - out/bundle.log
