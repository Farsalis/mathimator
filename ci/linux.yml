# Jobs on gitlab.com's hosted Linux runners (D67): lint, the fast test lanes,
# the UI build and the Rust pre-checks. Each job starts as soon as the pipeline
# does, except the cargo jobs, which wait for desktop/dist.

# Python jobs: uv 0.13.5, the release that [tool.uv] required-version demands
# (uv refuses to run with any other), and the uv-managed CPython that
# .python-version names.
.uv:
  extends: .every-pipeline
  image: ghcr.io/astral-sh/uv:0.13.5-trixie-slim
  needs: []
  variables:
    # The render group needs pycairo and ManimPango, which publish no Linux
    # wheels, and no Linux job imports Manim: the render suites run on Windows.
    # The dev group carries what the fast tests import, numpy included.
    UV_NO_GROUP: render
  cache:
    key:
      files: [uv.lock]
      prefix: $CI_JOB_NAME_SLUG
    paths: [.uv-cache, .uv-python]
  after_script:
    - uv cache prune --ci

# UI jobs: Node 24, the major desktop/.nvmrc names. npm's engine-strict
# refuses any other (D37).
.node:
  extends: .every-pipeline
  image: node:24.22.1-trixie-slim
  needs: []
  variables:
    npm_config_cache: $CI_PROJECT_DIR/.npm
  cache:
    key:
      files: [desktop/package-lock.json]
      prefix: npm
    paths: [.npm]
  before_script:
    - cd desktop
    - npm ci --prefer-offline --no-audit --no-fund

# Rust jobs: the toolchain in desktop/src-tauri/rust-toolchain.toml and the
# system libraries Tauri's Linux backend links: WebKitGTK 4.1, which brings
# GTK 3 and libsoup 3, and libxdo for the menus. Linux never compiles the
# cfg(windows) code, so these are pre-checks; test:rust:windows is the real
# build.
.rust:
  extends: .every-pipeline
  image: rust:1.93.0-trixie
  # The default custom-protocol feature embeds desktop/dist.
  needs: [build:ui]
  timeout: 45m
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    DEBIAN_FRONTEND: noninteractive
  cache:
    key:
      files: [desktop/src-tauri/Cargo.lock]
      prefix: cargo-linux
    paths: [.cargo/registry/index, .cargo/registry/cache, .cargo/git/db]
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev
    - cd desktop/src-tauri

build:ui:
  extends: .node
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [desktop/dist/]
    expire_in: 1 day

# The worker package builds, and setuptools has nothing to deprecate in its
# pyproject.toml (F161). setuptools only warns, so the job reads the log.
build:worker:
  extends: .uv
  stage: build
  script:
    - set -o pipefail
    - uv build worker --out-dir out/worker-dist 2>&1 | tee build-worker.log
    - if grep -q SetuptoolsDeprecationWarning build-worker.log; then exit 1; fi

lint:python:
  extends: .uv
  stage: lint
  script:
    - uv lock --check
    - uv run ruff check
    - uv run ruff format --check
    # mypy checks the code as it runs on Windows (pyproject.toml), then the
    # POSIX branches (D43).
    - uv run mypy
    - uv run mypy --platform linux

# The app version agrees across its manifests and every toolchain pin with its
# source (D72). In a tag pipeline the tag must also be v<app version>.
lint:versions:
  extends: .uv
  stage: lint
  script:
    - uv run python scripts/check_versions.py ${CI_COMMIT_TAG:+--tag "$CI_COMMIT_TAG"}

lint:ui:
  extends: .node
  stage: lint
  script:
    - npm run lint
    - npm run typecheck
    - npm run format:check

lint:rust:
  extends: .rust
  stage: lint
  script:
    - rustup component add rustfmt clippy
    - cargo fmt --check
    - cargo clippy --locked --all-targets -- -D warnings

# The hooks in .pre-commit-config.yaml that no other job covers. lint:python,
# lint:ui and lint:rust run the rest with the project's own environments, and
# Secret Detection replaces gitleaks, which has nothing staged to scan here.
lint:pre-commit:
  extends: .uv
  stage: lint
  variables:
    PRE_COMMIT_HOME: $CI_PROJECT_DIR/.pre-commit-cache
    SKIP: ruff-check,ruff-format,mypy,mypy-linux,gitleaks,prettier,eslint,tsc,cargo-fmt
  cache:
    - !reference [.uv, cache]
    - key:
        files: [.pre-commit-config.yaml]
        prefix: pre-commit
      paths: [.pre-commit-cache]
  before_script:
    # pre-commit asks git for the files to check.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends git
  script:
    - uv run pre-commit run --all-files --show-diff-on-failure

# The fast lane on both supported interpreters (D70): every test except Manim,
# the export, the offline bundle, Typst (test:typst) and the process-table
# walks (test:windows). The worker's coverage is reported, not enforced (D78).
test:python:
  extends: .uv
  stage: test
  parallel:
    matrix:
      # PYTHON_FALLBACK_VERSION and PYTHON_VERSION in packaging/versions.env.
      - UV_PYTHON: ["3.13.17", "3.14.9"]
  script:
    - >-
      uv run pytest tests scripts ci
      -m "not render and not export and not offline and not typst and not process_table"
      --junitxml="reports/junit-python-$UV_PYTHON.xml"
      --cov --cov-report=term --cov-report="xml:reports/coverage-python-$UV_PYTHON.xml"
  coverage: '/^TOTAL\s.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit-python-*.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage-python-*.xml

# The Typst tests with the Typst that packaging/versions.env pins. The install
# fails unless that release runs from PATH, so the typst tests cannot skip.
test:typst:
  extends: .uv
  stage: test
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends curl xz-utils
    - bash ci/install-typst.sh "$CI_PROJECT_DIR/.typst"
    - export PATH="$CI_PROJECT_DIR/.typst:$PATH"
  script:
    - uv run pytest tests -m typst --junitxml=reports/junit-typst.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths: [out/phase3/]
    reports:
      junit: reports/junit-typst.xml

test:ui:
  extends: .node
  stage: test
  script:
    - npm test -- --reporter=default --reporter=junit --outputFile.junit="$CI_PROJECT_DIR/reports/junit-vitest.xml"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: reports/junit-vitest.xml

# The Win32 Job Object reap test stays ignored here; test:rust:windows runs it.
test:rust:
  extends: .rust
  stage: test
  script:
    - cargo test --locked
