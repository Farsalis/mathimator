[package]
name = "mathimator"
version = "0.1.0"
description = "Mathimator desktop shell"
authors = ["Mathimator contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.93"

[lib]
name = "mathimator"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = { version = "2.8.3", default-features = false, features = ["gtk3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Keeps the open_project_path command in release builds, for the journey tests.
test-hooks = []
