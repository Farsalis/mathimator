[pytest]
testpaths = tests
pythonpath = worker
addopts = --strict-markers
markers =
    export: 1920x1080 30 fps export of reference-60 (slow; run separately)
    render: starts real Manim (and LaTeX for MathTex) for a preview, export, or partial re-render (slow; run after the build is pushed)
    offline: bundled interpreter, TinyTeX, and Typst with the network blocked
    typst: runs the typst binary from PATH (skipped when typst is not on PATH)
    process_table: walks the process table (the kernel32 helper on Windows, /proc on Linux)
