# The app version, for bump-my-version (D72). `bump-my-version bump minor`
# (or major or patch) rewrites it in every file that records it, and
# scripts/check_versions.py fails CI when any of them disagrees. The root
# pyproject.toml is not the app: its 0.0.0 only satisfies uv.
#
# A release bumps on a release branch, regenerates the changelog for the new
# tag, and commits both:
#
#   bump-my-version bump minor
#   git cliff --tag v<new version> --output CHANGELOG.md
#   git commit -am "chore(release): v<new version>"
#
# The tag is pushed on main after the release merge request is merged (D73).
[tool.bumpversion]
current_version = "0.1.0"
commit = false
tag = false

# The worker. uv.lock records the same two lines for the workspace member.
[[tool.bumpversion.files]]
filename = "worker/pyproject.toml"
search = '''
name = "mathimator-worker"
version = "{current_version}"'''
replace = '''
name = "mathimator-worker"
version = "{new_version}"'''

[[tool.bumpversion.files]]
filename = "uv.lock"
search = '''
name = "mathimator-worker"
version = "{current_version}"'''
replace = '''
name = "mathimator-worker"
version = "{new_version}"'''

[[tool.bumpversion.files]]
filename = "worker/mathimator_worker/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "desktop/package.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'

# package-lock.json records the version at the top and in packages[""].
[[tool.bumpversion.files]]
filename = "desktop/package-lock.json"
search = '''
  "name": "mathimator",
  "version": "{current_version}"'''
replace = '''
  "name": "mathimator",
  "version": "{new_version}"'''

[[tool.bumpversion.files]]
filename = "desktop/package-lock.json"
search = '''
      "name": "mathimator",
      "version": "{current_version}"'''
replace = '''
      "name": "mathimator",
      "version": "{new_version}"'''

# Cargo.toml and Cargo.lock record the same two lines for the shell crate.
[[tool.bumpversion.files]]
filename = "desktop/src-tauri/Cargo.toml"
search = '''
name = "mathimator"
version = "{current_version}"'''
replace = '''
name = "mathimator"
version = "{new_version}"'''

[[tool.bumpversion.files]]
filename = "desktop/src-tauri/Cargo.lock"
search = '''
name = "mathimator"
version = "{current_version}"'''
replace = '''
name = "mathimator"
version = "{new_version}"'''

[[tool.bumpversion.files]]
filename = "desktop/src-tauri/tauri.conf.json"
search = '"version": "{current_version}"'
replace = '"version": "{new_version}"'
