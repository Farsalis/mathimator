# Development workspace root. It is not a package: it only gathers the worker,
# the test and lint tools, and the Manim render stack into one uv.lock. uv
# requires a version; it is never built or released.
[project]
name = "mathimator-dev"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["mathimator-worker"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.2",
  "mypy==2.4.0",
  "pre-commit==4.7.0",
]
render = ["manim[typst]==0.22.0"]

[tool.uv]
package = false
# The render stack shipped in packaging/bundle/venv, read from its .dist-info
# folders, so the lock resolves to the versions the bundle was tested with.
constraint-dependencies = [
  "audioop-lts==0.2.2",
  "av==19.0.2",
  "beautifulsoup4==4.15.0",
  "click==8.5.0",
  "cloup==4.0.0",
  "colorama==0.4.6",
  "decorator==5.3.1",
  "glcontext==3.1.0",
  "isosurfaces==0.1.2",
  "manim==0.22.0",
  "manimpango==0.7.0",
  "mapbox-earcut==2.1.0",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "moderngl==5.13.0",
  "moderngl-window==3.1.1",
  "networkx==3.7",
  "numpy==2.5.4",
  "pillow==13.0.0",
  "pycairo==1.29.2",
  "pydub==0.25.1",
  "pyglet==2.1.19",
  "pyglm==2.8.3",
  "pygments==2.21.0",
  "rich==15.0.0",
  "scipy==1.18.1",
  "screeninfo==0.8.1",
  "skia-pathops==0.9.2",
  "soupsieve==3.0.4",
  "srt==3.5.3",
  "svgelements==1.9.6",
  "tqdm==4.70.1",
  "typing-extensions==4.16.0",
  "typst==0.15.0",
  "watchdog==6.0.0",
]

[tool.uv.workspace]
members = ["worker"]

[tool.uv.sources]
mathimator-worker = { workspace = true }

# Ruff lints and formats worker/ and tests/. scenes/ holds the golden codegen
# output that tests compare byte for byte, so Ruff never touches it.
[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["scenes", "packaging/bundle", "out"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests embed subprocess scripts and recorded notes as long string literals.
"tests/**" = ["E501"]

# Ruff's default style: double quotes, space indents, magic trailing commas.
[tool.ruff.format]
